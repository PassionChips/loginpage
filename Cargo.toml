[package]
name = "guideboy"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.52.3", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "set-header", "compression-gzip"] }
tower_governor = { version = "0.8.0", features = ["axum"] }
governor = "0.10.4"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
